# Publica o site e cuida das capas. Roda sozinho a cada envio para a main e
# também pelo botão "Run workflow" na aba Actions.
#
# Duas tarefas, em paralelo:
#   publicar  - passa o robô de capas (ferramentas/capas.py), guarda as capas
#               tratadas em capas/ e publica o site. Leva poucos minutos.
#   pesquisar - procura as edições brasileiras de cada livro
#               (ferramentas/pesquisa.py) e guarda as folhas de comparação
#               em pesquisa/. Não muda o site. Só pesquisa o que é novo.
#
# Para funcionar, em Settings > Pages > Build and deployment > Source,
# escolha "GitHub Actions" (uma vez só).
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # guardar capas e pesquisa no repositório
  pages: write        # publicar o site
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publicar
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o que o robô usa
        run: pip install --quiet pillow numpy scipy

      - name: Tratar as capas
        run: python ferramentas/capas.py

      - name: Guardar as capas no repositório
        run: |
          git config user.name "robo-de-capas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capas
          if git diff --cached --quiet; then
            echo "Nenhuma capa mudou."
          else
            git commit -m "Capas tratadas pelo robô"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: pesquisar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o que a pesquisa usa
        run: pip install --quiet pillow numpy scipy

      - name: Pesquisar edições brasileiras (só o que ainda não foi pesquisado)
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}   # opcional
          PESQUISA_MINUTOS: "28"
        run: python ferramentas/pesquisa.py

      - name: Guardar a pesquisa no repositório
        if: always()
        run: |
          git config user.name "robo-de-capas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pesquisa
          if git diff --cached --quiet; then
            echo "Pesquisa sem novidades."
          else
            git commit -m "Pesquisa de edições brasileiras"
            git pull --rebase origin main
            git push
          fi
