<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel do acervo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2314100c' rx='22' width='100' height='100'/><path d='M50 22l24 9v18c0 14.4-9.9 25.5-24 29.4C35.9 74.5 26 63.4 26 49V31z' fill='%23d9a441'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Outfit:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2;--card:#fff;--ink:#231c14;--muted:#6d6055;--faint:#9b8e83;--line:#e6ddd0;
  --gold:#d9a441;--wine:#8a2f3f;--green:#2e9e5b;--amber:#b9761f;
  --disp:'Fraunces',Georgia,serif;--ui:'Outfit',system-ui,-apple-system,sans-serif;
  --r:14px;--r-l:20px;--sh:0 2px 10px rgba(35,28,20,.06);
}
:root[data-theme="dark"]{
  --bg:#12100d;--card:#1b1814;--ink:#f2ece3;--muted:#a99c8e;--faint:#7d7266;--line:#2e2922;
  --sh:0 2px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.15}
button{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:1.2rem 16px 5rem}

/* topo */
.top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:1rem 0 1.2rem;border-bottom:1px solid var(--line);margin-bottom:1.4rem}
.top h1{font-size:1.5rem;flex:1;min-width:180px}
.who{font-size:.78rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:600;padding:.3rem .6rem;
  border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.pill .dot{width:7px;height:7px;border-radius:99px;background:var(--faint)}
.pill.on{color:var(--green);border-color:rgba(46,158,91,.4)} .pill.on .dot{background:var(--green)}

/* números */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-bottom:1.6rem}
.num{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem 1rem;box-shadow:var(--sh)}
.num b{display:block;font-family:var(--disp);font-size:1.5rem;line-height:1.1}
.num span{font-size:.74rem;color:var(--muted)}
.num.g b{color:var(--green)} .num.a b{color:var(--amber)}

/* abas */
.tabs{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap}
.tab{padding:.5rem .95rem;border-radius:99px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* cartões de pedido */
.ped{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:var(--r);
  padding:1rem;margin-bottom:.8rem;box-shadow:var(--sh)}
.ped.res{border-left-color:var(--amber)} .ped.ven{border-left-color:var(--green)} .ped.can{opacity:.62}
.ped-h{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ped-h b{font-size:1.05rem}
.ped-h .cod{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--faint)}
.ped-h .qdo{font-size:.74rem;color:var(--muted);margin-left:auto}
.st{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.16rem .5rem;border-radius:99px}
.st.res{background:rgba(185,118,31,.15);color:var(--amber)}
.st.ven{background:rgba(46,158,91,.15);color:var(--green)}
.st.can{background:var(--line);color:var(--muted)}
.ped ul{list-style:none;margin:.5rem 0;padding:0}
.ped li{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;padding:.2rem 0;color:var(--muted);border-bottom:1px dotted var(--line)}
.ped li span{color:var(--ink)}
.ped .tot{display:flex;justify-content:space-between;font-weight:700;padding-top:.5rem;font-size:.98rem}
.acts{display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.b{padding:.55rem 1rem;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.84rem;font-weight:600}
.b:hover{border-color:var(--faint)}
.b.go{background:var(--green);border-color:var(--green);color:#fff}
.b.no{color:var(--wine)}
.b[disabled]{opacity:.55;cursor:wait}
.aviso{font-size:.76rem;color:var(--muted);margin:.45rem 0 0}

/* acervo */
.busca{width:100%;padding:.8rem 1rem;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;margin-bottom:1rem}
.busca:focus{outline:none;border-color:var(--gold)}
.lin{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;background:var(--card);border:1px solid var(--line);
  border-radius:11px;margin-bottom:.4rem}
.lin .t{flex:1;min-width:0}
.lin .t b{display:block;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .t span{font-size:.72rem;color:var(--muted)}
.lin .v{font-weight:700;font-size:.9rem}
.vazio{text-align:center;color:var(--muted);padding:2.5rem 1rem;font-size:.9rem}

/* login */
.login{max-width:390px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);
  padding:2rem 1.6rem;box-shadow:var(--sh);text-align:center}
.login h1{font-size:1.45rem;margin-bottom:.3rem}
.login p{color:var(--muted);font-size:.87rem;margin:0 0 1.4rem}
.login input{width:100%;padding:.78rem .9rem;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;margin-bottom:.7rem}
.login input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.18)}
.login button{width:100%;padding:.85rem;border-radius:12px;border:none;background:var(--ink);color:var(--bg);
  font-weight:700;cursor:pointer;margin-top:.4rem}
.erro{color:var(--wine);font-size:.82rem;margin:.6rem 0 0;min-height:1.2em}
.ajuda{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;box-shadow:var(--sh)}
.ajuda h3{font-size:1rem;margin:1.1rem 0 .35rem} .ajuda h3:first-child{margin-top:0}
.ajuda p,.ajuda li{font-size:.87rem;color:var(--muted);margin:.2rem 0}
.ajuda ol{padding-left:1.1rem}
.toasts{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:.4rem}
.toast{background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:99px;font-size:.83rem;box-shadow:var(--sh)}
</style>
</head>
<body>

<div id="tela"></div>
<div class="toasts" id="toasts"></div>

<script src="acervo.js"></script>
<script src="base.js"></script>
<script src="loja.js"></script>
<script>
"use strict";
/* ==========================================================================
   admin.html — painel do dono: confirmar vendas, liberar reservas e dar
   baixa manual. Tudo o que é escrito aqui exige o login do e-mail dono.
   ========================================================================== */
const A = {
  aba: 'pedidos',
  pedidos: [],
  assinado: false,
  erroPedidos: null,
  desassinar: null,
  busca: '',

  init() {
    document.documentElement.setAttribute('data-theme', St.get('acv_theme', matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
    Loja.init({ onChange: () => this.render() });
  },

  logado() { return Loja.souDono(); },

  render() {
    if (!this.logado()) { this.telaLogin(); return; }
    if (!this.assinado) {
      this.assinado = true;                      // antes de assinar: a 1ª notificação
      this.desassinar = Loja.ouvirPedidos((lista, e) => {   // pode chegar na mesma hora
        this.pedidos = lista; this.erroPedidos = e; this.render();
      });
    }
    const n = Loja.numeros();
    const on = Loja.conexao === 'online';
    $('#tela').innerHTML = `
<div class="wrap">
  <div class="top">
    <h1>Painel do acervo</h1>
    <span class="pill ${on ? 'on' : ''}"><span class="dot"></span>${on ? 'ao vivo' : Loja.conexao}</span>
    <span class="who">${esc(Loja.emailAtual() || '')}</span>
    <button class="b" onclick="A.sair()">Sair</button>
  </div>

  <div class="nums">
    <div class="num"><b>${n.disponiveis}</b><span>anúncios à venda</span></div>
    <div class="num a"><b>${n.reservados}</b><span>reservados agora</span></div>
    <div class="num g"><b>${n.vendidos}</b><span>vendidos</span></div>
    <div class="num g"><b>${money(n.emCaixa)}</b><span>já vendido</span></div>
    <div class="num"><b>${money(n.naVitrine)}</b><span>ainda na vitrine</span></div>
  </div>

  <div class="tabs">
    <a class="tab" href="capas.html" style="text-decoration:none">Capas</a>
    ${[['pedidos', 'Pedidos'], ['acervo', 'Acervo'], ['ajuda', 'Como funciona']].map(([k, l]) =>
      `<button class="tab ${this.aba === k ? 'on' : ''}" onclick="A.ir('${k}')">${l}${k === 'pedidos' && this.aguardando().length ? ' · ' + this.aguardando().length : ''}</button>`).join('')}
  </div>

  <div id="corpo">${this['ab_' + this.aba]()}</div>
</div>`;
  },

  ir(k) { this.aba = k; this.render(); },
  aguardando() { return this.pedidos.filter(p => p.status === 'reservado'); },

  /* ------------------------------- pedidos ------------------------------- */
  ab_pedidos() {
    if (this.erroPedidos) return `<div class="vazio">Não consegui ler os pedidos.<br><small>${esc(this.erroPedidos.code || this.erroPedidos.message || '')}</small><br><br>Confira as regras do Firestore (README).</div>`;
    if (!this.pedidos.length) return `<div class="vazio">Nenhum pedido ainda. Quando alguém reservar pelo site, aparece aqui.</div>`;
    const ordem = { reservado: 0, vendido: 1, cancelado: 2 };
    return this.pedidos.slice().sort((a, b) => (ordem[a.status] - ordem[b.status]) || (b.criadoMs - a.criadoMs))
      .map(p => this.cardPedido(p)).join('');
  },

  cardPedido(p) {
    const cls = p.status === 'vendido' ? 'ven' : p.status === 'cancelado' ? 'can' : 'res';
    const rot = p.status === 'vendido' ? 'vendido' : p.status === 'cancelado' ? 'cancelado' : 'aguardando você';
    const itens = p.itens || [];
    const vence = p.ateMs && p.status === 'reservado'
      ? (p.ateMs < Date.now() ? 'reserva expirou' : 'segura até ' + new Date(p.ateMs).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }))
      : '';
    return `<div class="ped ${cls}">
  <div class="ped-h">
    <b>${esc(p.nome || 'sem nome')}</b>
    <span class="st ${cls}">${rot}</span>
    <span class="cod">#${p.id.slice(-6).toUpperCase()}</span>
    <span class="qdo">${p.criadoMs ? new Date(p.criadoMs).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''}</span>
  </div>
  ${p.contato ? `<div class="aviso">${esc(p.contato)}</div>` : ''}
  <ul>${itens.map(i => `<li><span>${esc(i.t)}</span>${money(i.v)}</li>`).join('')}</ul>
  <div class="tot"><span>${itens.length} ${itens.length === 1 ? 'livro' : 'livros'}</span><span>${money(p.total || 0)}</span></div>
  ${vence ? `<p class="aviso">${vence}</p>` : ''}
  ${p.status === 'reservado' ? `<div class="acts">
      <button class="b go" onclick="A.confirmar('${p.id}',this)">Confirmar venda</button>
      <button class="b no" onclick="A.liberar('${p.id}',this)">Liberar de volta</button>
      <button class="b" onclick="A.whats('${p.id}')">Chamar no WhatsApp</button>
    </div>` : ''}
</div>`;
  },

  async confirmar(id, bt) {
    const p = this.pedidos.find(x => x.id === id); if (!p) return;
    if (!confirm('Confirmar a venda de ' + (p.itens || []).length + ' livro(s) para ' + (p.nome || '') + '?\n\nOs exemplares saem do acervo e os anúncios que dependiam deles somem do site.')) return;
    bt.disabled = true; bt.textContent = 'Confirmando…';
    try { await Loja.confirmar(id); this.toast('Venda confirmada'); }
    catch (e) { bt.disabled = false; bt.textContent = 'Confirmar venda'; this.toast('Não deu: ' + (e.code || e.message)); }
  },

  async liberar(id, bt) {
    if (!confirm('Liberar estes livros de volta para a vitrine?')) return;
    bt.disabled = true; bt.textContent = 'Liberando…';
    try { await Loja.liberar(id); this.toast('Livros de volta na vitrine'); }
    catch (e) { bt.disabled = false; bt.textContent = 'Liberar de volta'; this.toast('Não deu: ' + (e.code || e.message)); }
  },

  whats(id) {
    const p = this.pedidos.find(x => x.id === id); if (!p) return;
    const linhas = (p.itens || []).map((i, k) => (k + 1) + '. ' + i.t + ' — ' + money(i.v)).join('\n');
    open('https://wa.me/?text=' + encodeURIComponent('Oi ' + (p.nome || '') + '! Sobre o pedido #' + p.id.slice(-6).toUpperCase() + ':\n\n' + linhas + '\n\nTotal: ' + money(p.total || 0) + '\n\nQuando fica bom para entregar?'), '_blank');
  },

  /* -------------------------------- acervo ------------------------------- */
  ab_acervo() {
    const q = norm(this.busca).trim();
    let lista = BOOKS;
    if (q) { const t = q.split(/\s+/); lista = lista.filter(b => t.every(x => norm(b.t + ' ' + b.author + ' ' + b.sg).includes(x))); }
    else lista = lista.filter(b => b.st !== 'livre');
    lista = lista.slice(0, 120);
    const rotulo = { livre: 'à venda', reservado: 'reservado', vendido: 'vendido', fora: 'saiu junto com outro anúncio' };
    return `<input class="busca" id="bs" placeholder="Buscar por título, autor ou saga — e dar baixa manual" value="${esc(this.busca)}">
${lista.length ? lista.map(b => `<div class="lin">
  <div class="t"><b>${esc(b.titleMain || b.t)}</b><span>${rotulo[b.st]}${this.levouJunto(b)}${b.sg ? ' · ' + esc(b.sg) : ''}${b.badge === 'kit' ? ' · coleção de ' + b.setOf : ''}</span></div>
  <span class="v">${money(b.v)}</span>
  ${b.estatico ? '<span class="aviso">fixo no cadastro</span>'
    : b.st === 'vendido' || b.st === 'fora' ? `<button class="b" onclick="A.livre('${b.slug}',this)">Devolver à vitrine</button>`
    : `<button class="b no" onclick="A.vendido('${b.slug}',this)">Marcar vendido</button>`}
</div>`).join('')
  : `<div class="vazio">${q ? 'Nada com esse termo.' : 'Nada vendido ou reservado ainda. Use a busca para dar baixa manual em algum título.'}</div>`}`;
  },

  /* de qual anúncio este exemplar saiu */
  levouJunto(b) {
    if (b.st !== 'fora') return '';
    for (const f of Loja.folhas(b.slug)) {
      const r = Loja.S.vendidos[f] || Loja.S.reservas[f];
      if (r && r.anuncio && BY[r.anuncio]) return ' com “' + esc(BY[r.anuncio].titleMain || BY[r.anuncio].t) + '”';
    }
    return '';
  },

  async vendido(slug, bt) {
    const b = BY[slug]; if (!b) return;
    const quem = prompt('Vendido para quem? (só para o seu controle)', '');
    if (quem === null) return;
    bt.disabled = true; bt.textContent = '…';
    try { await Loja.marcarVendido(slug, quem); this.toast('Baixa feita'); }
    catch (e) { bt.disabled = false; this.toast('Não deu: ' + (e.code || e.message)); }
  },
  async livre(slug, bt) {
    bt.disabled = true; bt.textContent = '…';
    try { await Loja.marcarLivre(slug); this.toast('De volta à vitrine'); }
    catch (e) { bt.disabled = false; this.toast('Não deu: ' + (e.code || e.message)); }
  },

  /* -------------------------------- ajuda -------------------------------- */
  ab_ajuda() {
    return `<div class="ajuda">
  <h3>O que acontece quando alguém reserva</h3>
  <p>A pessoa escolhe os livros no site, escreve o nome e confirma. Na mesma hora os exemplares saem da vitrine
  e o pedido aparece aqui como <b>aguardando você</b>. A reserva segura por ${CFG.horasReserva || 24} horas; depois
  disso os livros voltam sozinhos.</p>

  <h3>Confirmar ou liberar</h3>
  <ol>
    <li><b>Confirmar venda</b> — depois que receber o pagamento. O exemplar sai do acervo de vez.</li>
    <li><b>Liberar de volta</b> — se a pessoa desistiu. Os livros voltam para a vitrine na hora.</li>
  </ol>

  <h3>Por que alguns anúncios somem</h3>
  <p>O mesmo livro aparece em até três anúncios: avulso, na coleção da série e no box do universo. Quando um sai,
  só o anúncio que foi realmente vendido fica marcado como <b>Vendido</b> — os outros simplesmente somem do site,
  porque não dá mais para entregar aquele conjunto completo. Você não precisa editar nada à mão.</p>

  <h3>Venda fora do site</h3>
  <p>Vendeu no corredor? Vá em <b>Acervo</b>, busque o título e use <b>Marcar vendido</b>. Dá no mesmo.</p>
</div>`;
  },

  /* -------------------------------- login -------------------------------- */
  telaLogin() {
    if (this.desassinar) { this.desassinar(); this.desassinar = null; this.assinado = false; this.pedidos = []; }
    const jaTem = $('#email');
    if (jaTem) return;                       // não redesenha enquanto digita
    $('#tela').innerHTML = `<div class="login">
  <h1>Painel do acervo</h1>
  <p>Entre com o e-mail dono para ver os pedidos.</p>
  <input id="email" type="email" autocomplete="username" placeholder="e-mail" value="${esc(CFG.dono || '')}">
  <input id="senha" type="password" autocomplete="current-password" placeholder="senha">
  <button onclick="A.entrar()">Entrar</button>
  <p class="erro" id="erroL"></p>
</div>`;
    $('#senha').addEventListener('keydown', e => { if (e.key === 'Enter') this.entrar(); });
    $('#senha').focus();
  },

  async entrar() {
    const e = $('#email').value.trim(), s = $('#senha').value;
    const msg = $('#erroL'); msg.textContent = '';
    if (!e || !s) { msg.textContent = 'Preencha e-mail e senha.'; return; }
    try {
      await Loja.entrar(e, s);
      if (!Loja.souDono()) { msg.textContent = 'Esta conta não é a dona do acervo.'; await Loja.sair(); return; }
      this.render();
    } catch (err) {
      const c = String(err && err.code || '');
      msg.textContent = /wrong-password|invalid-credential|user-not-found/.test(c) ? 'E-mail ou senha não conferem.'
        : /too-many/.test(c) ? 'Muitas tentativas. Espere um pouco.'
        : /operation-not-allowed/.test(c) ? 'Ative o login por e-mail e senha no console do Firebase.'
        : 'Não consegui entrar (' + c + ')';
    }
  },

  async sair() { if (this.desassinar) { this.desassinar(); this.desassinar = null; this.assinado = false; } await Loja.sair(); this.pedidos = []; this.render(); },

  toast(m) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
    $('#toasts').appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 320); }, 2600);
  }
};

document.addEventListener('input', e => { if (e.target.id === 'bs') { A.busca = e.target.value; clearTimeout(A._b); A._b = setTimeout(() => { A.render(); const i = document.getElementById('bs'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 260); } });

document.readyState === 'loading'
  ? addEventListener('DOMContentLoaded', () => A.init(), { once: true })
  : A.init();
</script>
</body>
</html>
